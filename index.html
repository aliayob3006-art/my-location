<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مشاركة الموقع</title>

  <!-- خريطة Leaflet (شكل أحلى وحركة ناعمة) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      background: #0f172a; color: #e2e8f0;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 20px 14px; gap: 16px;
    }
    h1 { font-size: 22px; font-weight: 700; }
    .card {
      background: #1e293b; border: 1px solid #334155; border-radius: 16px;
      padding: 18px; width: 100%; max-width: 460px;
    }
    .hint { color: #94a3b8; font-size: 14px; line-height: 1.7; }
    button {
      width: 100%; margin-top: 12px; padding: 15px; font-size: 17px;
      font-weight: 700; font-family: inherit; color: #0f172a;
      background: #38bdf8; border: none; border-radius: 12px; cursor: pointer;
    }
    button:active { filter: brightness(0.9); }
    button.view { background: #a78bfa; }
    button.stop { background: #f87171; color: #450a0a; }
    button.ghost { background: transparent; color: #94a3b8; border: 1px solid #334155; font-size: 14px; }
    .row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #334155; }
    .row:last-child { border-bottom: none; }
    .row .label { color: #94a3b8; }
    .row .value { font-weight: 700; direction: ltr; }
    .status { margin-top: 12px; font-size: 14px; min-height: 20px; }
    .ok { color: #4ade80; } .err { color: #f87171; } .live { color: #38bdf8; }
    #dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#4ade80; margin-left:6px; vertical-align:middle; }
    @keyframes blink { 50% { opacity:.2; } }
    #dot.on { animation: blink 1.2s infinite; }
    #map { width: 100%; height: 320px; border-radius: 12px; margin-top: 14px; display: none; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <h1>📍 مشاركة الموقع</h1>

  <!-- ====== شاشة اختيار الدور ====== -->
  <div class="card" id="chooser">
    <p class="hint">اختار شو بدك تعمل:</p>
    <button id="goBroadcast">📡 أبثّ موقعي</button>
    <button id="goView" class="view">👁️ أتابع موقع</button>
  </div>

  <!-- ====== شاشة البث ====== -->
  <div class="card hidden" id="broadcast">
    <p class="hint">
      لما تضغط "ابدأ البث"، المتصفّح رح يسألك إذا بتسمح بالوصول لموقعك.
      انت حرّ توافق أو ترفض، وبتقدر توقف البث بأي لحظة.
    </p>
    <button id="btnBroadcast">ابدأ البث</button>
    <div class="status" id="bStatus"></div>
    <div id="bInfo" class="hidden">
      <div class="row"><span class="label">الحالة</span><span class="value"><span id="dot"></span><span id="bLive">—</span></span></div>
      <div class="row"><span class="label">خط العرض</span><span class="value" id="bLat">—</span></div>
      <div class="row"><span class="label">خط الطول</span><span class="value" id="bLng">—</span></div>
      <div class="row"><span class="label">الدقّة</span><span class="value" id="bAcc">—</span></div>
      <div class="row"><span class="label">عدد التحديثات</span><span class="value" id="bCount">0</span></div>
    </div>
    <button class="ghost" onclick="location.reload()">⟵ رجوع</button>
  </div>

  <!-- ====== شاشة المتابعة ====== -->
  <div class="card hidden" id="view">
    <p class="hint">عم نتابع آخر موقع مبثوث لايف.</p>
    <div class="status" id="vStatus">بانتظار وصول الموقع...</div>
    <div id="vInfo" class="hidden">
      <div class="row"><span class="label">خط العرض</span><span class="value" id="vLat">—</span></div>
      <div class="row"><span class="label">خط الطول</span><span class="value" id="vLng">—</span></div>
      <div class="row"><span class="label">الدقّة</span><span class="value" id="vAcc">—</span></div>
      <div class="row"><span class="label">آخر تحديث</span><span class="value" id="vAge">—</span></div>
    </div>
    <div id="map"></div>
    <button class="ghost" onclick="location.reload()">⟵ رجوع</button>
  </div>

  <!-- مكتبات Firebase و Leaflet -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // ====== إعداد الربط بـ Firebase (الوسيط) ======
    const firebaseConfig = {
      apiKey: "AIzaSyCSlumHFmCVpAyT2XP_JNcSGNdCKZNj3BM",
      authDomain: "my-location-4f660.firebaseapp.com",
      databaseURL: "https://my-location-4f660-default-rtdb.firebaseio.com",
      projectId: "my-location-4f660",
      storageBucket: "my-location-4f660.firebasestorage.app",
      messagingSenderId: "844752352538",
      appId: "1:844752352538:web:4ba5aa3fb3a57cbe4c28a3"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const locRef = db.ref("live/location");   // المكان اللي بينحفظ فيه آخر موقع

    // عناصر الشاشات
    const chooser   = document.getElementById("chooser");
    const broadcast = document.getElementById("broadcast");
    const view      = document.getElementById("view");

    document.getElementById("goBroadcast").onclick = () => { chooser.classList.add("hidden"); broadcast.classList.remove("hidden"); };
    document.getElementById("goView").onclick      = () => { chooser.classList.add("hidden"); view.classList.remove("hidden"); startViewing(); };

    // ========================================================
    //  وضع البث: نقرا الموقع من الـ GPS ونكتبه بالـ Firebase
    // ========================================================
    const btnB = document.getElementById("btnBroadcast");
    const bStatus = document.getElementById("bStatus");
    const bInfo = document.getElementById("bInfo");
    const dot = document.getElementById("dot");
    let watchId = null, bCount = 0;

    btnB.onclick = () => {
      if (watchId !== null) { stopBroadcast(); return; }
      if (!navigator.geolocation) { bStatus.className="status err"; bStatus.textContent="متصفّحك ما بيدعم الموقع."; return; }

      bStatus.className = "status"; bStatus.textContent = "عم نطلب الموقع... وافق على الإذن.";

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          bCount++;
          const lat = pos.coords.latitude, lng = pos.coords.longitude, acc = Math.round(pos.coords.accuracy);

          // نكتب الموقع بالـ Firebase — هون بيوصل للمتابع لايف
          locRef.set({ lat, lng, acc, t: Date.now(), live: true });

          document.getElementById("bLat").textContent = lat.toFixed(6);
          document.getElementById("bLng").textContent = lng.toFixed(6);
          document.getElementById("bAcc").textContent = acc + " م";
          document.getElementById("bCount").textContent = bCount;
          document.getElementById("bLive").textContent = "البث شغّال";
          bInfo.classList.remove("hidden"); dot.className = "on";
          bStatus.className = "status live"; bStatus.textContent = "📡 البث شغّال — موقعك بيتحدّث لحاله.";
          btnB.textContent = "أوقف البث"; btnB.className = "stop";
        },
        (err) => {
          bStatus.className = "status err";
          if (err.code===1) bStatus.textContent = "رفضت إعطاء الإذن.";
          else if (err.code===2) bStatus.textContent = "ما قدرنا نحدد الموقع (شغّل الـ GPS).";
          else bStatus.textContent = "صار خطأ، جرّب مرّة ثانية.";
          stopBroadcast();
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    };

    function stopBroadcast() {
      if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
      locRef.update({ live: false, t: Date.now() });   // نعلم المتابع إنه البث وقف
      dot.className = ""; document.getElementById("bLive").textContent = "متوقّف";
      bStatus.className = "status"; bStatus.textContent = "⏸️ وقفت البث.";
      btnB.textContent = "ابدأ البث"; btnB.className = "";
    }

    // ========================================================
    //  وضع المتابعة: نسمع التغييرات من Firebase ونعرضها لايف
    // ========================================================
    let map = null, marker = null, lastT = 0, lastLive = false;

    function startViewing() {
      // نجهّز الخريطة
      document.getElementById("map").style.display = "block";
      map = L.map("map").setView([31.9, 35.2], 13);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19, attribution: "© OpenStreetMap"
      }).addTo(map);

      // نسمع آخر موقع — بينفّذ كل ما يتغيّر (لايف)
      locRef.on("value", (snap) => {
        const d = snap.val();
        if (!d || typeof d.lat !== "number") {
          document.getElementById("vStatus").textContent = "ما في موقع مبثوث بعد.";
          return;
        }
        lastT = d.t || 0; lastLive = d.live;
        document.getElementById("vInfo").classList.remove("hidden");
        document.getElementById("vLat").textContent = d.lat.toFixed(6);
        document.getElementById("vLng").textContent = d.lng.toFixed(6);
        document.getElementById("vAcc").textContent = (d.acc != null ? d.acc + " م" : "—");

        // نحرّك العلامة على الخريطة
        const p = [d.lat, d.lng];
        if (!marker) { marker = L.marker(p).addTo(map); map.setView(p, 16); }
        else { marker.setLatLng(p); map.panTo(p); }
      });

      // نحدّث "آخر تحديث" والحالة كل ثانية
      setInterval(updateAge, 1000);
    }

    function updateAge() {
      if (!lastT) return;
      const secs = Math.round((Date.now() - lastT) / 1000);
      const vAge = document.getElementById("vAge");
      const vStatus = document.getElementById("vStatus");
      vAge.textContent = secs < 60 ? ("قبل " + secs + " ثانية") : ("قبل " + Math.round(secs/60) + " دقيقة");

      if (lastLive && secs < 15) { vStatus.className = "status live"; vStatus.textContent = "📡 بث مباشر — الموقع بيتحدّث لايف."; }
      else if (lastLive) { vStatus.className = "status"; vStatus.textContent = "⚠️ ما وصل تحديث من فترة (يمكن النت ضعيف)."; }
      else { vStatus.className = "status"; vStatus.textContent = "⏸️ الشخص أوقف البث. هاد آخر موقع."; }
    }
  </script>

</body>
</html>
